/* 中文字体人格：本地打包的 OFL 开源字（无远程，守 MV3 离线铁律）。
   文津宋体(刻铭组) · 霞鹜文楷(书写组) · 朱雀仿宋(铅印组)，均 SIL OFL 1.1，子集化见 fonts/CJK-OFL-LICENSE.txt */
@font-face{ font-family:"WenJin Mincho"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/WenJinMincho-subset.woff2") format("woff2"); }
@font-face{ font-family:"LXGW WenKai"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/LXGWWenKai-subset.woff2") format("woff2"); }
@font-face{ font-family:"Zhuque Fangsong"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/ZhuqueFangsong-subset.woff2") format("woff2"); }

/* Vazirmatn — OFL 现代 RTL 字体，由波斯设计师 Saber Rastikerdar 设计。
   子集化覆盖 ASCII + Latin-1 + 阿拉伯主区 + 阿拉伯补充 + 表现形式 A/B（覆盖乌尔都所需变体）。
   ~32KB woff2，给阿拉伯/乌尔都/波斯文剪藏跨级提升质感。 */
@font-face{ font-family:"Vazirmatn"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/Vazirmatn-subset.woff2") format("woff2"); }

/* Nanum Myeongjo — OFL 韩国开源明朝体（衬线）by Naver。替代之前的 Nanum Gothic（无衬线），
   让 'other' 档读起来像书页——和中文 LXGW 楷书、乌尔都 Nastaliq 的"温度家族"对齐。
   子集化：ASCII + Latin-1 + 全部 11172 谚文方块 + 音素字母 + 兼容音素 + 扩展 A/B。
   ~305KB woff2。unicode-range 限定到谚文区，避免污染日中文。 */
@font-face{ font-family:"Nanum Myeongjo"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/NanumMyeongjo-subset.woff2") format("woff2");
  unicode-range:U+1100-11FF, U+3130-318F, U+A960-A97F, U+AC00-D7AF, U+D7B0-D7FF; }

/* Korean System — 仅 local() 的 @font-face，优先调系统韩文【明朝/衬线】（macOS
   AppleMyungjo、Windows Batang、Linux Noto Serif CJK KR），与 other 档"书页感衬线"
   一致（旧版误用黑体 Apple SD Gothic Neo，韩文成 sans 与全卡衬线不搭）。缺则落打包
   的 Nanum Myeongjo（亦衬线）。unicode-range 限谚文区，不碰中日文。 */
@font-face{ font-family:"Korean System"; font-style:normal; font-weight:400;
  src:local("AppleMyungjo"),
      local("Batang"), local("BatangChe"),
      local("Noto Serif CJK KR"), local("NotoSerifCJKkr-Regular");
  unicode-range:U+1100-11FF, U+3130-318F, U+A960-A97F, U+AC00-D7AF, U+D7B0-D7FF; }

/* JP System — 仅 local() 的 @font-face，借本机日文明朝（macOS Hiragino Mincho、
   Windows Yu Mincho、Linux/Android Noto Serif CJK JP 等）渲染日文。日文落 other 兜底
   档，原字体栈无日文字体 → 価/実 等日文专用字掉到无衬线、汉字取中文字形；本档放栈最前
   修正之。unicode-range 限到假名+汉字（韩文谚文不在此区，不受影响）。不打包字体（+0
   体积）、纯 local（无网络/无 CDN，隐私零改动）。 */
@font-face{ font-family:"JP System"; font-style:normal; font-weight:400;
  src:local("Hiragino Mincho ProN"), local("HiraMinProN-W3"),
      local("Toppan Bunkyu Mincho"), local("YuMincho"), local("Yu Mincho"),
      local("BIZ UDMincho"), local("MS Mincho"),
      local("Noto Serif CJK JP"), local("Noto Serif JP"), local("Source Han Serif JP"),
      local("IPAexMincho");
  unicode-range:U+3000-30FF, U+31F0-31FF, U+FF00-FFEF, U+3400-4DBF, U+4E00-9FFF; }
/* JP System 真粗体（W6）——仅 local()。加粗款(clay/letterpress)请求 600/700 时，
   日文取真 Hiragino W6 等粗明朝（保留横细竖粗对比），而非合成伪粗（伪粗会显黑体）。
   缺真粗字族的平台靠 font-synthesis-weight:none 退回清爽明朝，绝不伪粗。0 体积、纯 local。 */
@font-face{ font-family:"JP System"; font-style:normal; font-weight:600 700;
  src:local("Hiragino Mincho ProN W6"), local("HiraMinProN-W6"),
      local("Toppan Bunkyu Midashi Mincho"), local("YuMincho Demibold"),
      local("Noto Serif CJK JP Bold"), local("Source Han Serif JP Bold"), local("Source Han Serif JP Heavy");
  unicode-range:U+3000-30FF, U+31F0-31FF, U+FF00-FFEF, U+3400-4DBF, U+4E00-9FFF; }
/* Zen Old Mincho — 打包日文明朝（古旧书版气，OFL by Zen Old Mincho Project Authors，见 ZenOldMincho-OFL.txt）。
   日文落 other 兜底档时原栈只有 local 日文明朝 + LXGW 兜底，两个老毛病：① 加粗款(letterpress/clay/rubbing,
   weight 600)在部分平台 local 粗明朝匹配不稳 → 缺字一路掉到栈尾 system-ui 黑体(角ゴシック)；② LXGW 是中文字体，
   圧/円/満/発 等日文专字无覆盖、且汉字取中文字形。本款打包入 data-script="ja" 栈首根治：JIS1+2 汉字+假名齐全、
   日文原生字形、跨机器一致、可嵌入导出 PNG。子集 ~1.9MB(7298 码位)，纯 url() 本地、零 CDN。 */
@font-face{ font-family:"Zen Old Mincho"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/ZenOldMincho-subset.woff2") format("woff2"); }

/* Devanagari System — 天城文衬线。栈首为打包的 Noto Serif Devanagari（清润、笔画匀、对比柔，
   比 Tiro 秀气；OFL，本地 ~50KB woff2、零 CDN/远程），其后 local() 系统衬线兜底。
   印地语落 other 兜底档、原栈无天城文字体 → 本档放栈前用 NSD 渲染，与古纸卡气质一致。
   （曾用 Tiro，因笔画过敦实显粗已换 NSD。）unicode-range 限天城文区，不碰中日韩。 */
@font-face{ font-family:"Devanagari System"; font-style:normal; font-weight:400;
  src:url("../fonts/NotoSerifDevanagari-subset.woff2") format("woff2"),
      local("Noto Serif Devanagari"), local("Shobhika"),
      local("Devanagari MT"), local("Kohinoor Devanagari");
  unicode-range:U+0900-097F, U+A8E0-A8FF, U+1CD0-1CFF; }

/* Noto Nastaliq Urdu — Google's OFL Nastaliq font for Urdu/Persian.
   Nastaliq is the high-art calligraphic style native to South Asia and Persia
   (the product name "Bayaaz" بیاض is itself a Nastaliq word).
   Subset to ASCII + Latin-1 + full Arabic + Supplement/Extended + Presentation
   Forms A/B = ~231KB woff2. Only loaded for rtl-ur tier (Urdu/Persian/Kurdish
   detected via 11 distinguishing characters), so Arabic users still get Naskh. */
@font-face{ font-family:"Noto Nastaliq Urdu"; font-style:normal; font-weight:400; font-display:swap;
  src:url("../fonts/NotoNastaliqUrdu-subset.woff2") format("woff2"); }

*, *::before, *::after { box-sizing:border-box; }
:root{
  --gold:#c8a86a; --gold-dim:rgba(200,168,106,.42); --gold-soft:rgba(200,168,106,.16); --cream:#efe2c2;
  --vermil:#b03828; --accent:#8b2929; --label-text:#d4bf85;
  --serif:"Source Serif 4", "Vazirmatn", Georgia, serif; --serif-cjk:"Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Vazirmatn", serif;
  --display:"Cormorant Garamond", Georgia, serif; --cinzel:"Cinzel", serif;
  --script:"Pinyon Script", cursive; --hand:"Caveat", cursive;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  /* 中文三嗓音（系统外字优先，回退最稳系统字）：刻铭=宋 · 书写=楷 · 铅印=仿宋 */
  --zh-engr:"WenJin Mincho", var(--serif-cjk);
  --zh-hand:"LXGW WenKai", "Kaiti SC","STKaiti","KaiTi", var(--serif-cjk);
  --zh-press:"Zhuque Fangsong", "STFangsong","FangSong", "WenJin Mincho", var(--serif-cjk); /* 朱雀繁体覆盖 ~59%，缺字落系统仿宋→已打包文津宋→宋 */
  --grain:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='150'%20height='150'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='150'%20height='150'%20filter='url(%23n)'/%3E%3C/svg%3E");
  --tooth:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='220'%3E%3Cfilter%20id='t'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.4'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='220'%20height='220'%20filter='url(%23t)'/%3E%3C/svg%3E");
}


.ex{ width:400px; align-self:start; position:relative; overflow:hidden; border-radius:2px; padding:44px 42px;
  font-family:var(--serif); line-height:1.76; color:#2b1d10; box-shadow:0 4px 14px rgba(0,0,0,.42),0 24px 56px rgba(0,0,0,.46); }
.ex .layer{ position:absolute; inset:0; pointer-events:none; }
.ex .grain{ background:var(--grain); background-size:160px; opacity:.08; mix-blend-mode:multiply; }
.ex > .content{ position:relative; z-index:4; }
.ex .sub{ text-align:center; font-size:13.5px; margin:0 0 6px; line-height:1.4; opacity:.72; text-wrap:balance; }
.ex .sub:empty{ display:none; }
.ex .subrule{ width:38px; height:1px; background:currentColor; opacity:.3; margin:10px auto 18px; }
.ex .q{ font-size:16px; text-align:justify; margin:0; }
.ex[data-lang="en"] .q, .ex[data-lang="vi"] .q{ text-align:left; hyphens:none; } /* 拉丁窄栏毛边：justify 在 5-8 词/行摊出沟壑；zh 保基础层 justify（CLReq 字网均匀） */
.ex[data-code][data-code] .q{ font-family:"Courier New",Courier,monospace; font-size:13.5px; line-height:1.7; text-align:left; white-space:pre-wrap; hyphens:none; } /* 代码剪藏"打字机"形态：等宽/左对齐/保缩进；双写属性 (0,4,0) 压过后方各语言档 (0,3,0)（含 zh 的 serif-cjk） */
.ex .q p{ margin:0 0 .78em; } .ex .q p:last-child{ margin-bottom:0; }
.ex .meta{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:22px; padding-top:13px; border-top:.5px solid rgba(43,29,16,.18); font-size:12px; }
.ex .src{ font-style:italic; opacity:.62; text-wrap:balance; } /* 短行均衡律：src/sub 属 caption 类短展示行(CSS Text 4 的 balance 适应症)——匀长度防劈词组('do not'曾被拆行)；balance 只认长度不认标点，断在逗号是几何巧合非机制，全语种安全(仅改断点选择) */ .ex .src:empty{ display:none; }
.ex .date{ font-family:var(--display); font-variant-numeric:oldstyle-figures; letter-spacing:1.6px; font-size:13px; opacity:.6; white-space:nowrap; margin-left:auto; } /* ⑤ 日期恒靠右（无来源时也不跑左） */
.ex--clip2 .date{ font-family:var(--hand); font-variant:normal; letter-spacing:0; font-size:16px; }
.ex[data-lang="zh"] .date{ font-family:var(--zh-hand); font-variant:normal; letter-spacing:2px; font-size:12.5px; } /* C：中文数字日期，霞鹜文楷，与出处合成一处落款 */
.ex[data-lang="zh"] .q{ font-family:var(--serif-cjk); line-height:1.95; line-break:strict; text-autospace:normal; overflow-wrap:break-word; text-justify:inter-character; } /* ⑨ 中英混排：盘古之白 + 防溢出 + 字符间均摊 */
.ex[data-lang="zh"] .q .di{ font-size:3.0em; line-height:1.3; padding:0; margin:.02em .26em 0 0; } /* ⑧ 首字下沉规整为整数 2 行高，环绕与下方正文对齐字网 */
.ex[data-lang="zh"] .sub{ font-weight:600; letter-spacing:2.5px; font-style:normal; }
.ex--bookplate[data-lang="en"] .q, .ex--letterpress[data-lang="en"] .q,
.ex--bookplate[data-lang="vi"] .q, .ex--letterpress[data-lang="vi"] .q{ text-align:center; text-wrap:balance; } /* balance：行间匀词防孤行（"triad."独悬案）；Chrome114+，>6行自动降级不影响长文 */ /* 仪式款居中=款式身份；116 行窄栏毛边(0,3,0)曾误伤 EN 居中(基础层仅 0,2,0)——同特异度靠后复位；居中无 justify 河沟问题，毛边化理由不适用 */
.ex--bookplate[data-lang="zh"] .q, .ex--letterpress[data-lang="zh"] .q{ text-align:justify; } /* CLReq: 中文正文方块网格应两端对齐，居中散排破坏字网 */
/* other 档 Ex Libris 和 Letterpress 也取消居中（与 zh 同理：居中是西方藏书票/铅印传统） */
.ex--bookplate[data-lang="other"] .q, .ex--letterpress[data-lang="other"] .q{ text-align:left; }
.ex--bookplate[data-lang="other"] .meta{ justify-content:space-between; }
/* rtl 档：自然右对齐 + meta 反向排列 */
.ex--bookplate[data-lang="rtl"] .q, .ex--letterpress[data-lang="rtl"] .q{ text-align:right; }
.ex--bookplate[data-lang="rtl"] .meta{ justify-content:space-between; flex-direction:row-reverse; }
.ex[data-lang="zh"] .src{ font-style:normal; font-family:var(--zh-hand); letter-spacing:.5px; opacity:.78; } /* 出处恒楷=霞鹜文楷：一支署名手贯穿全卡 */
.ex--bookplate[data-lang="zh"] .src{ font-size:14px; } /* Pinyon script has no CJK; kaiti at a calmer size */
.ex[data-lang="zh"] .sub{ font-family:var(--serif-cjk); }
/* ── 中文字体人格（镜像英文系统；仅 zh 生效，en 不受影响）──
   范围：刻铭组/书写组/铅印组 题注(.sub)+首字(.di) 换字面；正文恒系统宋、出处恒楷、日期不动。
   全换 4 款(waka/clip2/bookplate/letterpress) 额外把 正文(.q)+出处(.src) 并入嗓音。
   依据预览 _cowork-output/previews/2026-06-14-zh-persona-final-v2.html，用户逐款点头 2026-06-14。*/
.ex--illum[data-lang="zh"] .sub, .ex--cert[data-lang="zh"] .sub, .ex--wax[data-lang="zh"] .sub, .ex--papyrus[data-lang="zh"] .sub, .ex--quran[data-lang="zh"] .sub, .ex--rubbing[data-lang="zh"] .sub,
.ex--illum[data-lang="zh"] .q .di, .ex--cert[data-lang="zh"] .q .di, .ex--wax[data-lang="zh"] .q .di, .ex--papyrus[data-lang="zh"] .q .di, .ex--quran[data-lang="zh"] .q .di, .ex--rubbing[data-lang="zh"] .q .di{ font-family:var(--zh-engr); }
.ex--waka[data-lang="zh"] .sub, .ex--palm[data-lang="zh"] .sub, .ex--clay[data-lang="zh"] .sub, .ex--bookplate[data-lang="zh"] .sub, .ex--clip2[data-lang="zh"] .sub,
.ex--waka[data-lang="zh"] .q .di, .ex--palm[data-lang="zh"] .q .di, .ex--clay[data-lang="zh"] .q .di, .ex--bookplate[data-lang="zh"] .q .di, .ex--clip2[data-lang="zh"] .q .di{ font-family:var(--zh-hand); }
.ex--letterpress[data-lang="zh"] .sub, .ex--letterpress[data-lang="zh"] .q .di{ font-family:var(--zh-press); }
/* 全换款：正文 + 出处也并入嗓音 */
.ex--waka[data-lang="zh"] .q, .ex--clip2[data-lang="zh"] .q, .ex--bookplate[data-lang="zh"] .q,
.ex--waka[data-lang="zh"] .src, .ex--clip2[data-lang="zh"] .src, .ex--bookplate[data-lang="zh"] .src{ font-family:var(--zh-hand); }
.ex--letterpress[data-lang="zh"] .q{ font-family:var(--zh-press); } /* 出处归入“出处恒楷”，故此处不再含 .src */
.dropcap .q .di{ float:left; font-size:3.1em; line-height:.82; padding:.04em .1em 0 0; font-weight:600; }
/* ④ 无副标题→正文加顶部留白（en/zh 通用，避免贴顶部线/纹章/图标）。
   带顶部角饰/横线的款（illum 结纹、clay 楔形带、papyrus 横带）多让一些。 */
.ex .sub:empty ~ .q{ margin-top:22px; }
.ex--illum .sub:empty ~ .q, .ex--clay .sub:empty ~ .q, .ex--papyrus .sub:empty ~ .q{ margin-top:32px; }
/* ⑥ 出处与日期都没有 → 去掉 meta 分隔线。两种"没有"都覆盖：内容为空(:empty) 或被开关隐藏(hide-src/hide-date)。
   Letterpress 等自带 .rule 纹饰：其 meta 本就无边框、◆ 分隔独立存在，不受影响。 */
.ex.hide-date.hide-src .meta,
.ex.hide-date .meta:has(.src:empty){ border-top:none; margin-top:6px; padding-top:0; }
/* B：中文版日期独占一行、右对齐（落款式）；出处恒居左——即便居中款（Ex Libris/Letterpress）中文排版也不居中；英文版维持一行不变 */
.ex[data-lang="zh"] .meta{ display:block; }
.ex[data-lang="zh"] .src{ display:block; text-align:left; }
.ex[data-lang="zh"] .date{ display:block; text-align:right; margin-top:5px; }

/* ===== Sample Book of Papers ===== */
html,body{ height:100%; }
body{ margin:0; min-height:100vh; overflow:hidden; color:var(--label-text); font-family:var(--display),serif;
  background-color:#1e150c;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'%3E%3Cfilter%20id='gg'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.6'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='240'%20height='240'%20filter='url(%23gg)'%20opacity='0.4'/%3E%3C/svg%3E"), radial-gradient(150% 105% at 50% -10%, rgba(88,62,34,.5), transparent 56%);
  background-size:240px 240px, cover; background-position:center; background-blend-mode:soft-light, normal; }
.stageroom{ position:relative; height:calc(100vh - 10px); margin:5px auto; max-width:1560px; display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:18px 30px 8px; border-radius:8px;
  background-color:#2c2014;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'%3E%3Cfilter%20id='gg'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.6'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='240'%20height='240'%20filter='url(%23gg)'%20opacity='0.4'/%3E%3C/svg%3E"), radial-gradient(1040px 520px at 50% 6%, rgba(252,232,188,.2), transparent 64%), linear-gradient(160deg,#46331f,#2a1d11);
  background-size:240px 240px, cover, cover; background-blend-mode:soft-light, screen, normal;
  box-shadow:inset 0 0 180px rgba(36,20,8,.36); }
.title-bar{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 16px; font-size:13px; letter-spacing:0; font-variant:small-caps; color:#97825c; }

/* book */
@keyframes bookin{ from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1} }
.skip .book{ animation:none; }
.book::before{ content:''; position:absolute; left:50%; top:0; bottom:0; width:34px; transform:translateX(-50%); z-index:4; pointer-events:none;
  background:linear-gradient(to right, transparent, rgba(80,50,25,.22) 30%, rgba(40,25,12,.42) 50%, rgba(80,50,25,.22) 70%, transparent); }
.ribbon{ position:absolute; top:-9px; left:calc(50% + 26px); width:16px; height:92px; z-index:5;
  background:linear-gradient(180deg,#8b2929,#6a1010); clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%); box-shadow:2px 2px 4px rgba(0,0,0,.3); }

.page{ position:relative; padding:26px 46px 34px; display:flex; flex-direction:column; min-height:0; }
.page.left{ align-items:center; justify-content:center; color:#3a2618; }

/* featured hero */
.featured{ position:relative; z-index:1; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; width:100%; transform-origin:center center; margin-bottom:28px; }
/* long clips: scale floor + scrollable preview (export still renders full size) */
.featured.overflow{ align-items:flex-start; overflow-y:auto; padding:26px 0 6px; scrollbar-width:thin; scrollbar-color:rgba(168,48,32,.4) transparent;
  -webkit-mask-image:linear-gradient(to bottom, #000 0, #000 calc(100% - 30px), transparent 100%);
  mask-image:linear-gradient(to bottom, #000 0, #000 calc(100% - 30px), transparent 100%); }
.featured.overflow.scrolled{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 30px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 30px), transparent 100%); }
/* reading mode: the card lies flat on the page — no floating drop shadow smearing the parchment */
.featured.overflow .ex.active{ box-shadow:0 1px 6px rgba(40,22,8,.22); }
.featured.overflow::-webkit-scrollbar{ width:3px; }
.featured.overflow::-webkit-scrollbar-track{ background:transparent; margin:10px 0; }
.featured.overflow::-webkit-scrollbar-thumb{ border-radius:0; background:linear-gradient(180deg, transparent 0, #b6362a 12%, #8f2418 50%, #b6362a 84%, transparent 100%); opacity:.5; }
/* === Optimization 6: page-turn timing + easing === */
.featured.turning{ animation:leaf .75s cubic-bezier(.4,0,.2,1); }
@keyframes leaf{ 0%{ transform:perspective(1500px) rotateY(-18deg); opacity:.25; filter:brightness(.82) } 50%{ opacity:.6 } 100%{ transform:none; opacity:1; filter:none } }
.featured .ex{ display:none; transform-origin:center; }
.featured .ex.active{ display:block; }
/* ── 就地编辑（仅 hero 卡）：默认纯预览、不打扰；双击进入编辑才显朱批，与侧边栏双击编辑一致。
   朱砂红=光标+朱批竖线 · 金褐=选中——全在插件配色内。 ── */
#featured [data-edit]{ outline:none; position:relative; border-radius:3px;
  transition:background .18s ease, box-shadow .18s ease; caret-color:#9e4636; }
/* 编辑中（双击后 contenteditable=true）：金褐底 + 红褐柳叶朱笔（中粗两端尖，呼应朱墨笔锋）+ 红褐光标 */
#featured [data-edit][contenteditable="true"]{ cursor:text; background:rgba(200,168,106,.13); }
#featured [data-edit][contenteditable="true"]::before{ content:''; position:absolute;
  left:-16px; top:2px; bottom:2px; width:5px; opacity:.9;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%206%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M3%201%20C1.1%2026%201.1%2074%203%2099%20C4.9%2074%204.9%2026%203%201%20Z'%20fill='%239e4636'/%3E%3C/svg%3E") no-repeat center/100% 100%; }
#featured [data-edit][contenteditable="true"]::selection{ background:rgba(200,168,106,.42); }
#featured [data-edit][contenteditable="true"] ::selection{ background:rgba(200,168,106,.42); }
/* 批注随文明·暗地与中调全谱（07-27 两轮）：rubbing=泥金题跋（乌金拓引首题签以金书深签的装裱正统；朱圈初稿被裁——金石家的朱是小笔圈点非整段刷朱，整段选中配题跋金更合身，且归队产品绀纸金泥深色谱系）；
   clay=润湿痕（泥板未干时以水润面抹平重刻——湿泥色深，选中即润湿备改）。 */
#featured .ex--rubbing [data-edit][contenteditable="true"]{ background:rgba(214,186,126,.09); caret-color:#d8c9a0; }
#featured .ex--rubbing [data-edit][contenteditable="true"]::selection,
#featured .ex--rubbing [data-edit][contenteditable="true"] ::selection{ background:rgba(214,186,126,.30); }
#featured .ex--rubbing [data-edit][contenteditable="true"]::before{ filter:none; opacity:.75;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%206%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M3%201%20C1.1%2026%201.1%2074%203%2099%20C4.9%2074%204.9%2026%203%201%20Z'%20fill='%23c9a860'/%3E%3C/svg%3E"); } /* 金泥柳叶：拓片编辑语言归金泥谱系，朱笔提亮版在黑石上过刺（她报）——笔随纱换 */
#featured .ex--clay [data-edit][contenteditable="true"]{ background:rgba(74,40,16,.07); caret-color:#3a2210; }
#featured .ex--clay [data-edit][contenteditable="true"]::selection,
#featured .ex--clay [data-edit][contenteditable="true"] ::selection{ background:rgba(74,40,16,.24); }
/* 批注色随文明（按文物配色）：中调暖底三款与默认金褐同色系相撞而隐形——
   各换其文明自己的批注工具色。papyrus=朱批（埃及红赭 rubric 之源）；
   palm=敷墨（贝叶经刻后敷灯烟墨工艺）；letterpress=铅字灰（type metal：铅锡锑活字的冷银灰——选中即拾字；二稿弃蓝铅：与浏览器默认选区蓝太近）。 */
#featured .ex--papyrus [data-edit][contenteditable="true"]{ background:rgba(158,60,36,.07); }
#featured .ex--papyrus [data-edit][contenteditable="true"]::selection,
#featured .ex--papyrus [data-edit][contenteditable="true"] ::selection{ background:rgba(158,60,36,.26); }
#featured .ex--palm [data-edit][contenteditable="true"]{ background:rgba(58,44,20,.06); }

#featured .ex--palm [data-edit][contenteditable="true"] ::selection{ background:rgba(58,44,20,.22); }

   LXGW WenKai 源自 Klee One JP，含完整假名 → 让它当日文首选字体（0 字节增量）
   Korean System 仅在谚文字符生效（unicode-range 限定），优先用系统韩文字体（macOS
   Apple SD Gothic Neo / Windows Malgun Gothic），Nanum 作兜底。 */
.ex[data-lang="other"] .q,
.ex[data-lang="other"] .sub{
 font-family:"JP System", "Devanagari System", "Korean System", "Nanum Myeongjo", "LXGW WenKai", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-synthesis-weight:none; /* 加粗款(clay/letterpress)上禁止合成伪粗——CJK 假粗会压平明朝对比、显黑体；有真粗字族(如日文 W6)则用真粗，无则保持清爽明朝 */
}
/* 来源 .src：英文默认是 Source Serif 4 Italic（无 CJK / 假名 / 谚文等），
   对非中英文字符会 fallback 到瘦衬线，与 LXGW 正文不和谐。统一改为
   LXGW WenKai → system 兜底，与正文字体气质一致。 */
.ex[data-lang="other"] .src{
 font-family:"JP System", "Devanagari System", "Korean System", "Nanum Myeongjo", "LXGW WenKai", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-synthesis-weight:none; /* 同上：禁止合成伪粗 */
 font-style:normal;
 letter-spacing:.3px;
 font-size:13px;  /* override Ex Libris .src 19px which is only sized for Pinyon Script Latin */
}
.ex[data-lang="other"] .q{
 text-align:left;
 hyphens:none;
 line-break:auto;
 line-height:1.9; /* other 档默认（天城文/泰文：上下叠加符需更宽行距）。日/韩另由 data-script 覆盖 */
 letter-spacing:0.01em;
 font-feature-settings:"palt";
}
/* other 档内按文字微调（JS 给卡片打 data-script）：日文密排满格需更松，韩文等高方块抱团更佳 */
.ex[data-script="ja"] .q{ line-height:2.0; text-autospace:normal; line-break:strict; font-feature-settings:normal; } /* JLREQ：和欧文细缝(1/4em) + 禁则；去 palt → 句读用全角传统留白(后带半角 aki)，不压成约物詰め */
.ex[data-script="ko"] .q{ line-height:1.8; }
.ex[data-script="hi"] .q, .ex[data-script="hi"] .sub, .ex[data-script="hi"] .src{ letter-spacing:normal; } /* ILREQ：天城文不可加字距——正文清 0.01em，出处/副标题清 other 档的 .3px/1px */
/* 日文专属：打包 Zen Old Mincho 置栈首（见上方 @font-face 注释）——根治加粗款掉黑体 + 中文字形汉字。仅 data-script="ja"，不碰其他语种。 */
.ex[data-script="ja"] .q, .ex[data-script="ja"] .sub, .ex[data-script="ja"] .src{
 font-family:"Zen Old Mincho", "JP System", "Nanum Myeongjo", "LXGW WenKai", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
}
.ex[data-lang="other"] .sub{
 text-transform:none;
 letter-spacing:1px;
 font-weight:500;
}
/* 关闭首字下沉：天城文元音符号合字、阿拉伯草书连写在 ::first-letter 下会破排 */
.ex[data-lang="other"] .q::first-letter{
 font-size:inherit; float:none; margin:0;
 color:inherit; font-family:inherit;
}
.ex[data-lang="other"] .q .di{ display:none; }
/* Letterpress 在 other 档：不强制居中——居中是西方铅印 title page 的传统，
   对应英文摘录的卷首语美学；非英文（日韩泰印等）没有这种排版传统，
   保留与正文一致的左对齐反而更得体。Ex Libris (bookplate) 同理。 */

/* RTL 档：阿拉伯 / 乌尔都 / 希伯来。在 other 基础上叠加方向镜像
   Vazirmatn 优先（覆盖阿拉伯系所有变体），希伯来落系统字体 */
.ex[data-lang="rtl"] .q,
.ex[data-lang="rtl"] .sub{
 font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
}
/* 来源 .src：同 other，让来源字体与正文一致 */
.ex[data-lang="rtl"] .src{
 font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-style:normal;
 letter-spacing:normal;  /* 阿拉伯连写：不可加字距（会切连笔），与 .q 一致 */
 font-size:15px; opacity:.6;  /* 来源：明显淡于正文；与日期靠字号(15>12)拉开。三级层级 正文>来源>日期。override Ex Libris .src 19px */
}
.ex[data-lang="rtl"] .q{
 direction:rtl;
 text-align:right;
 hyphens:none;
 line-break:auto;
 line-height:1.85;
}
.ex[data-lang="rtl"] .sub{
 direction:rtl;
 text-align:center;
 text-transform:none;
 letter-spacing:normal;  /* 阿拉伯连写：不可加字距（会切连笔） */
 font-weight:500;
}
/* RTL 落款：出处 + 日期竖排、靠右(RTL 的对齐边)，像中文卡的落款——
   避免日期被 margin-auto 推到参差不齐的左缘、贴边显突兀。 */
.ex[data-lang="rtl"] .meta{ display:block; text-align:right; }
.ex[data-lang="rtl"] .src{ display:block; }
/* 日期字体跟随正文字体——让数字用 Vazirmatn 自带拉丁数字字形，与阿拉伯主体一气 */
.ex[data-lang="rtl"] .date{ display:block; direction:rtl; text-align:right; margin:5px 0 0;
 line-height:1.9; word-spacing:1px;
 font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-feature-settings:normal; }
/* 关闭首字下沉（同 other） */
.ex[data-lang="rtl"] .q::first-letter{
 font-size:inherit; float:none; margin:0;
 color:inherit; font-family:inherit;
}
.ex[data-lang="rtl"] .q .di{ display:none; }
/* Letterpress 在 rtl 档：取消居中（同 other），让正文按 RTL 自然右对齐。
   meta 保持 RTL 默认（来源右、日期左，方向反向）。 */

/* （Ex Libris/bookplate 的 other/rtl .src 字体已由通用 .ex[data-lang="other"|"rtl"] .src 接管，
    不再单独声明） */

/* RTL-UR 档：乌尔都 / 波斯 / 库尔德。在 rtl 基础上，把字体换成 Nastaliq。
   Naskh（Vazirmatn）和 Nastaliq 是两种完全不同的书法风格——阿拉伯用 Naskh，
   南亚/波斯用 Nastaliq。产品名 Bayaaz（بیاض）本身就是 Nastaliq 词，
   给乌尔都用户配 Nastaliq 是文化语义闭环。
   继承 rtl 档的所有方向/对齐/首字下沉关闭规则，只换字体族。 */
.ex[data-lang="rtl-ur"] .q,
.ex[data-lang="rtl-ur"] .sub{
 font-family:"Noto Nastaliq Urdu", "Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 line-height:2.5;  /* Nastaliq 字形高度较大，需要更宽行距才舒展 */
}
.ex[data-lang="rtl-ur"] .src{
 font-family:"Noto Nastaliq Urdu", "Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-style:normal;
 letter-spacing:normal;  /* Nastaliq 连写：绝不可加字距（切连笔最严重），与 .q 一致 */
 font-size:15px; opacity:.6;  /* 来源：明显淡于正文；与日期靠字号(15>12)拉开。三级层级 正文>来源>日期 */
}
.ex[data-lang="rtl-ur"] .q{
 direction:rtl;
 text-align:right;
 hyphens:none;
 line-break:auto;
}
.ex[data-lang="rtl-ur"] .sub{
 direction:rtl;
 text-align:center;
 text-transform:none;
 letter-spacing:normal;  /* Nastaliq 连写：不可加字距 */
 font-weight:500;
}
/* RTL 落款（同 rtl）：出处 + 日期竖排靠右，日期不再贴左缘 */
.ex[data-lang="rtl-ur"] .meta{ display:block; text-align:right; }
.ex[data-lang="rtl-ur"] .src{ display:block; }
/* 日期字体跟随正文 Nastaliq——数字字形与乌尔都主体一家 */
.ex[data-lang="rtl-ur"] .date{ display:block; direction:rtl; text-align:right; margin:5px 0 0;
 line-height:2.1; word-spacing:2px;
 font-family:"Noto Nastaliq Urdu", "Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
 font-feature-settings:normal; }
/* 关闭首字下沉（Nastaliq 的连笔被 ::first-letter 拽断会非常难看） */
.ex[data-lang="rtl-ur"] .q::first-letter{
 font-size:inherit; float:none; margin:0;
 color:inherit; font-family:inherit;
}
.ex[data-lang="rtl-ur"] .q .di{ display:none; }
/* rtl-ur 内：波斯(无乌尔都专属字母 ٹڈڑںھےہ)→ 现代 Naskh/Vazirmatn（现代波斯散文/新闻的标准体），
   不走 Nastaliq；乌尔都(含专属字母)完全不受影响，仍 Nastaliq。
   提高特异度 [data-script="fa"] 盖过上面的 Nastaliq 字体/行高规则。代价：波斯诗也走 Vazirmatn(无法程序区分诗/文)。 */
.ex[data-lang="rtl-ur"][data-script="fa"] .q,
.ex[data-lang="rtl-ur"][data-script="fa"] .sub,
.ex[data-lang="rtl-ur"][data-script="fa"] .src,
.ex[data-lang="rtl-ur"][data-script="fa"] .date{
 font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
}
.ex[data-lang="rtl-ur"][data-script="fa"] .q{ line-height:1.85; }                    /* Vazirmatn 无需 Nastaliq 的 2.5 大行距 */
.ex[data-lang="rtl-ur"][data-script="fa"] .date{ line-height:1.9; word-spacing:normal; }
/* Ex Libris + Letterpress：跟随 rtl 的非居中取消规则 */
.ex--bookplate[data-lang="rtl-ur"] .q, .ex--letterpress[data-lang="rtl-ur"] .q{ text-align:right; }
.ex--bookplate[data-lang="rtl-ur"] .meta{ justify-content:space-between; flex-direction:row-reverse; }
.ex--bookplate[data-lang="rtl-ur"] .exlibris{ display:none; }

/* ── 越南语 (vi)：拉丁字母+变音符，正文/排版/首字均同英文（Source Serif 4 全覆盖越南语）。
   仅装饰性 latin 子集字体缺越南语变音符（Pinyon Script 花体来源、Cinzel 罗马刻铭题注），
   故只把 .sub / bookplate .src 换成 Source Serif，避免 ệ/ự/độ 等掉进系统衬线 fallback 与花体混排。 */
.ex[data-lang="vi"] .sub{ font-family:"Source Serif 4",serif; font-variant:normal; letter-spacing:normal; }
.ex--bookplate[data-lang="vi"] .src{ font-family:"Source Serif 4",serif; font-style:italic; font-size:14px; }
.ex--bookplate[data-lang="vi"] .exlibris{ display:none; } /* 藏书票拉丁标签行：越南语卡隐藏，纹章保留（同其他非英文档） */

/* 日期微调（非中英文档 rtl/rtl-ur/other/vi）：一行安静的落款。曾把浓度提到 .74 + 字距 3px，
   结果拉丁数字在 Nastaliq/谚文旁边显得"重"、抢戏；改为调淡 + 收紧，退回背景做落款。
   数字仍是 Cormorant 花体 oldstyle 西文数字，纯 CSS、零新增体积。中文(自有 .date 规则)/英文(基础规则)不受影响。 */
.ex[data-lang="rtl"] .date, .ex[data-lang="rtl-ur"] .date,
.ex[data-lang="other"] .date, .ex[data-lang="vi"] .date{ letter-spacing:normal; font-size:12px; opacity:.5; }
/* 逐款修正：底色深/对比低的纸样上，通用 .5/.6 的来源·日期会糊，单独提浓（仍守"来源>日期"差距）。
   放在通用规则之后以胜出（同特异度后写者赢）。 */
.ex--clay .date, .ex--clip2 .date{ opacity:.78; }   /* Cuneiform / Clipping：日期提浓到可见 */
.ex--letterpress .src{ opacity:1; }                  /* Letterpress：来源提到全色，清晰可读 */
.ex--letterpress .date{ opacity:.85; }               /* Letterpress：日期再提浓，仍低于来源保持层级差 */

</style>
</head>
